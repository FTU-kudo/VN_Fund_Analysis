name: Refresh fund data now

# Manual entry point for a full refresh. The scheduled daily workflow is unchanged.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  require-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ] || [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this refresh on main after the workflow is merged."
            exit 1
          fi

  refresh:
    needs: require-main
    # Reuse the daily collector, its archive budget and its concurrency lock.
    uses: ./.github/workflows/daily.yml
    with:
      limit: ""
      dry_run: false
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
