name: Static research dashboard

on:
  push:
    branches: [main]
    paths:
      - "config.toml"
      - "dashboard/**"
      - "data/**"
      - "vnfa/**"
      - "scripts/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/daily.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "config.toml"
      - "dashboard/**"
      - "data/**"
      - "vnfa/**"
      - "scripts/**"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/daily.yml"
      - ".github/workflows/pages.yml"
  # Daily's GITHUB_TOKEN commit does not trigger a second push workflow.
  # Rebuild Pages whenever the daily workflow finishes on the default branch (success or failure with updated workflow_status.json).
  workflow_run:
    workflows: ["Daily fund holdings check (all funds)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || ((github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Set up Node.js for dependency-free UI tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run repository Python tests
        run: python -m pytest -q
      - name: Test static dashboard utilities
        run: node --test tests/test_dashboard_ui.mjs
      - name: Check data archive size budget
        run: python scripts/check_data_budget.py --data-dir data
      - name: Export sanitized static data
        run: python scripts/export_dashboard.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dashboard

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == github.event.repository.default_branch))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
